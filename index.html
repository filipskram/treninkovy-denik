<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Tréninkový deník</title>
<meta name="description" content="Tréninkový deník – plán, série, progres. Data zůstávají jen v zařízení.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tréninky">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#e9ecef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#11151a" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root{
  --bg:#e9ecef; --surface:#ffffff; --surface2:#f3f5f7; --ink:#18202b; --muted:#5b6676; --line:#d5dae1;
  --blue:#1f5fbf; --green:#2a8a43; --yellow:#b88700; --red:#c0392b; --done:#e3f3e7;
  --font:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --cond:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#11151a; --surface:#1a2028; --surface2:#222a34; --ink:#e7ebf0; --muted:#97a3b3; --line:#2e3742;
    --blue:#6a9ff0; --green:#5cc277; --yellow:#e6b733; --red:#ef6b5c; --done:#1d3326;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11151a; --surface:#1a2028; --surface2:#222a34; --ink:#e7ebf0; --muted:#97a3b3; --line:#2e3742;
  --blue:#6a9ff0; --green:#5cc277; --yellow:#e6b733; --red:#ef6b5c; --done:#1d3326;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);touch-action:manipulation;overscroll-behavior:none;scrollbar-width:none}
html::-webkit-scrollbar,body::-webkit-scrollbar,.tablewrap::-webkit-scrollbar,.sheet::-webkit-scrollbar,.cf-box::-webkit-scrollbar{display:none}
.tablewrap,.sheet,.cf-box{scrollbar-width:none}
button,.tabs{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--font);-webkit-text-size-adjust:100%}
#app{max-width:640px;margin:0 auto;padding:16px 14px calc(88px + env(safe-area-inset-bottom,0px))}
h1{font:700 2.3rem/1 var(--cond);margin:8px 0 4px;letter-spacing:.01em}
h2{font:600 1.35rem/1.15 var(--cond);margin:0}
h3{font:600 1.3rem/1.15 var(--cond);margin:0}
p{margin:0}
.sub{color:var(--muted);font-size:.95rem}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
input,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:10px;background:var(--surface2);border:1px solid var(--line);font-weight:600}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.danger{color:var(--red)}
.btn.small{min-height:36px;padding:0 12px;font-size:.92rem}
.stack{display:grid;gap:12px}
.head{margin-bottom:16px}

/* Day picker */
.day{display:grid;grid-template-columns:1fr auto;align-items:center;gap:4px 12px;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.day.next{border:2px solid var(--blue)}
.day .tag{grid-column:1/-1;font-size:.85rem;font-weight:600;color:var(--blue)}
.day h2{font-size:1.7rem}
.day .go{font:700 1.1rem var(--cond);color:var(--blue)}

/* Exercise card */
.ex{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 12px 12px}
.ex-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.swap{font-size:.88rem;font-weight:600;color:var(--blue);padding:4px 0;white-space:nowrap}
.alt-note{font-size:.85rem;color:var(--muted)}
.last{margin-top:6px;font-size:.92rem;color:var(--muted)}
.hint{margin-top:6px;font-size:.92rem;font-weight:600;padding-left:10px;border-left:4px solid var(--muted)}
.hint.up{border-color:var(--green);color:var(--green)}
.hint.hold{border-color:var(--blue)}
.hint.stall{border-color:var(--yellow)}
.sets{margin-top:10px;display:grid;gap:6px}
.set-h,.set{display:grid;grid-template-columns:22px minmax(0,1.15fr) minmax(0,1fr) 46px;gap:6px;align-items:center}
.set-h{font-size:.78rem;color:var(--muted);padding:0 2px}
.set{padding:4px 2px;border-radius:10px}
.set.is-done{background:var(--done)}
.set .n{font:600 1.05rem var(--cond);color:var(--muted);text-align:center}
.step{display:grid;grid-template-columns:34px minmax(0,1fr) 34px;align-items:center;background:var(--surface2);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.step button{height:44px;font:600 1.35rem var(--cond);color:var(--muted)}
.step input{border:0;background:transparent;text-align:center;padding:0;height:44px;font:700 1.5rem var(--cond);border-radius:0}
.ok{height:44px;border-radius:10px;border:2px solid var(--line);font:700 1.2rem var(--cond);color:var(--muted)}
.set.is-done .ok{background:var(--green);border-color:var(--green);color:#fff}
.ex-actions{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:8px}
.note.today{background:transparent;border-style:dashed}
.enote{display:block;color:var(--muted);font-size:.88rem;font-style:italic}
.ex-actions button{font-size:.88rem;color:var(--muted);font-weight:600;padding:6px 4px}
.finish{display:grid;grid-template-columns:1fr 2fr;gap:10px;margin-top:6px}

/* Tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs div{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tabs button{height:60px;font:600 1.15rem var(--cond);color:var(--muted);letter-spacing:.02em}
.tabs button[aria-current="page"]{color:var(--blue);box-shadow:inset 0 3px 0 var(--blue)}
.seg{display:inline-grid;grid-auto-flow:column;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:3px;margin-bottom:14px}
.seg button{padding:7px 16px;border-radius:8px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink)}

/* History */
.sess{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.sess-top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.sess ul{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:4px;font-size:.95rem}
.sess li b{font-weight:600}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;margin:12px 0}
.chart svg{display:block;width:100%;height:auto}
table{width:100%;border-collapse:collapse;font-size:.95rem}
td,th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
th{font-weight:600;color:var(--muted);font-size:.85rem}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px 8px}

/* Overview */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px}
.card svg{display:block;width:100%;height:auto}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.85rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:0}
.rec{border-left:4px solid var(--blue);padding:2px 0 2px 10px;display:grid;gap:2px;justify-items:start}
.rec.warn{border-color:var(--yellow)}
.rec.good{border-color:var(--green)}
.rec p{font-size:.95rem}
.rec .btn{margin-top:6px}
.gb{display:grid;gap:8px}
.gb-row{display:grid;grid-template-columns:6.6rem minmax(0,1fr) 2.4rem;gap:8px;align-items:center;font-size:.92rem}
.gb-row>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gb-track{position:relative;height:18px;background:var(--surface2);border-radius:6px;overflow:hidden}
.gb-band{position:absolute;top:0;bottom:0;background:var(--done)}
.gb-bar{position:absolute;left:0;top:4px;bottom:4px;border-radius:4px;background:var(--blue)}
.gb-bar.ok{background:var(--green)}
.gb-bar.lo{background:var(--yellow)}
.gb-v{text-align:right;font-weight:600}
.pl{display:grid}
.pl-row{display:grid;grid-template-columns:minmax(0,1fr) 76px 4.4rem;gap:10px;align-items:center;text-align:left;width:100%;padding:9px 0;border-top:1px solid var(--line)}
.pl-row:first-child{border-top:0}
.pl-name{font-weight:600;display:grid;min-width:0;line-height:1.25}
.pl-name .sub,.pl-ch .sub{font-weight:400;font-size:.82rem}
.spark{width:76px;height:26px;color:var(--muted)}
.pl-ch{text-align:right;font:700 1.1rem var(--cond);display:grid;color:var(--muted)}
.spark.up,.pl-ch.up{color:var(--green)}
.spark.down,.pl-ch.down{color:var(--red)}

.bw-list{display:flex;flex-wrap:wrap;gap:6px}
.bw-list span{display:inline-flex;align-items:center;gap:4px;background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:2px 2px 2px 10px;font-size:.88rem}
.bw-list button{width:30px;height:30px;color:var(--muted);font-size:1.1rem}
.sum-nav{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.stat{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;gap:2px;min-width:0}
.stat b{font:700 1.45rem/1.1 var(--cond);overflow-wrap:anywhere}
.stat span{font-size:.82rem;color:var(--muted)}
.pday-when{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr) minmax(0,.8fr);gap:8px}
.cal-form{display:grid;gap:10px}
.cf-box{max-height:calc(100vh - 40px);overflow:auto}
.cf-box p.sub{font-size:.9rem;font-weight:400}

/* Plan editor */
.pday{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:12px}
.pday-top{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
.pday-top input{font:600 1.25rem var(--cond)}
.pex{border-top:1px solid var(--line);padding-top:12px;display:grid;gap:8px}
.pex-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
label{display:grid;gap:3px;font-size:.8rem;color:var(--muted);font-weight:500}
label input,label select,textarea,#bw-in,#newvar{font-size:1rem}
.pex-tools{display:flex;gap:4px;justify-content:flex-end}
.pex-tools button{min-width:36px;height:32px;border-radius:8px;background:var(--surface2);color:var(--muted);font-weight:600}
.savebar{position:sticky;bottom:calc(70px + env(safe-area-inset-bottom,0px));margin-top:14px;display:flex;gap:10px;justify-content:flex-end;z-index:5}
.mode{margin-top:24px;font-size:.85rem;color:var(--muted)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:22px;display:grid;gap:12px}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:640px;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:grid;gap:8px;max-height:85vh;overflow:auto}
.opt{text-align:left;padding:13px 14px;border-radius:10px;background:var(--surface2);border:1px solid var(--line);font-weight:500}
.opt[aria-pressed="true"]{border:2px solid var(--blue);font-weight:600}
.addrow{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:6px}
.pr{display:inline-block;margin-left:6px;padding:0 6px;border-radius:6px;background:var(--yellow);color:#1a1a1a;font-size:.75rem;font-weight:600;vertical-align:1px}
.dl-tag{font-size:.8rem;color:var(--yellow);font-weight:600}
.hint.deload{border-color:var(--yellow)}
.banner{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--yellow);border-radius:12px;padding:12px 14px;display:grid;gap:10px;margin-bottom:14px;justify-items:start}
.cal{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:6px}
.wk{display:grid;grid-template-columns:3.4rem 1fr 4.6rem;align-items:center;gap:8px;font-size:.9rem}
.cells{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.c{height:22px;border-radius:5px;background:var(--surface2);border:1px solid var(--line)}
.c.on{background:var(--green);border-color:var(--green)}
.c.fut{opacity:.35}
.wc{color:var(--muted);text-align:right}
.wk.hd span{font-size:.75rem;color:var(--muted);text-align:center}
.pager{display:flex;justify-content:space-between;gap:10px;margin:0 0 12px}
.sec-h{margin:20px 0 8px}
td.num,th.num{text-align:right;white-space:nowrap}
.note{margin-top:8px;padding:8px 10px;border-radius:8px;background:var(--surface2);border:1px solid var(--line);font-size:.92rem;white-space:pre-wrap}
.note-row{display:grid;gap:8px;justify-items:start;margin-top:10px}
textarea{font:inherit;color:var(--ink);background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;resize:vertical}
.cf{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px}
.cf-box{background:var(--surface);border-radius:16px;padding:20px;max-width:360px;width:100%;display:grid;gap:16px}
.cf-box p{font-weight:500;font-size:1.05rem}
.cf-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:40;max-width:90vw}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
@media (max-width:380px){.pex-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.step{grid-template-columns:28px minmax(0,1fr) 28px}}
</style>
</head>
<body>
<main id="app"><p class="sub">Načítám…</p></main>
<nav class="tabs" aria-label="Sekce"><div>
  <button data-act="tab" data-v="train">Trénink</button>
  <button data-act="tab" data-v="over">Přehled</button>
  <button data-act="tab" data-v="hist">Historie</button>
  <button data-act="tab" data-v="plan">Plán</button>
</div></nav>
<div id="overlay"></div>
<script>
(function(){
const app = document.getElementById('app');
const overlay = document.getElementById('overlay');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rid = () => Math.random().toString(36).slice(2,10);
const num = v => { if (v === '' || v == null) return null; const n = parseFloat(String(v).replace(',', '.')); return isFinite(n) ? n : null; };
const r2 = n => Math.round(n * 100) / 100;
const kg = n => n == null ? '–' : String(r2(n)).replace('.', ',');
const norm = s => String(s || '').trim().toLowerCase();
const clone = o => JSON.parse(JSON.stringify(o));
const dShort = iso => new Date(iso).toLocaleDateString('cs-CZ', {day:'numeric', month:'numeric'});
const dLong = iso => new Date(iso).toLocaleDateString('cs-CZ', {weekday:'long', day:'numeric', month:'numeric', year:'numeric'});

const LS = {
  get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} },
  del(k){ try { localStorage.removeItem(k); } catch(e){} }
};

const S = { plan:{days:[]}, sessions:[], draft:null, view:'train', ready:false,
            planDraft:null, histTab:'list', progName:null, sheet:null, pending:false, deloads:[], wkOff:0, notes:{},
            body:[], sumMode:'m', sumOff:0 };
const sortSess = () => S.sessions.sort((a,b) => b.date.localeCompare(a.date));

/* ---------- storage (IndexedDB v zařízení, záložně localStorage) ---------- */
const KEYS = {plan:'wl-plan', sessions:'wl-sessions', deloads:'wl-deloads', notes:'wl-notes', body:'wl-body'};
const idb = {
  db: null,
  open(){
    return new Promise((res, rej) => {
      if (!('indexedDB' in window)) return rej(new Error('no idb'));
      const rq = indexedDB.open('treninkovy-denik', 1);
      rq.onupgradeneeded = () => rq.result.createObjectStore('kv');
      rq.onsuccess = () => { this.db = rq.result; res(); };
      rq.onerror = () => rej(rq.error);
    });
  },
  get(k){
    return new Promise((res, rej) => {
      const rq = this.db.transaction('kv').objectStore('kv').get(k);
      rq.onsuccess = () => res(rq.result); rq.onerror = () => rej(rq.error);
    });
  },
  setMany(obj){
    return new Promise((res, rej) => {
      const tx = this.db.transaction('kv', 'readwrite'), st = tx.objectStore('kv');
      for (const [k, v] of Object.entries(obj)) st.put(clone(v), k);
      tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error);
    });
  }
};
let useIdb = false;
async function persist(obj){
  if (useIdb) { await idb.setMany(obj); return; }
  for (const [k, v] of Object.entries(obj)) {
    try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){ throw new Error('storage'); }
  }
}
const localStore = {
  async init(){
    try {
      await idb.open(); useIdb = true;
      const vals = await Promise.all(Object.values(KEYS).map(k => idb.get(k)));
      if (vals.every(v => v === undefined)) {
        // první spuštění s IndexedDB – převezmi případná starší data z localStorage
        const old = Object.fromEntries(Object.values(KEYS).map(k => [k, LS.get(k, undefined)]).filter(([, v]) => v !== undefined));
        if (Object.keys(old).length) await idb.setMany(old);
        Object.values(KEYS).forEach((k, i) => { vals[i] = old[k]; });
      }
      [S.plan, S.sessions, S.deloads, S.notes, S.body] = vals;
    } catch(e) {
      useIdb = false;
      S.plan = LS.get(KEYS.plan); S.sessions = LS.get(KEYS.sessions); S.deloads = LS.get(KEYS.deloads); S.notes = LS.get(KEYS.notes); S.body = LS.get(KEYS.body);
    }
    S.plan = S.plan || {days:[]}; S.sessions = S.sessions || []; S.deloads = S.deloads || []; S.notes = S.notes || {}; S.body = S.body || [];
    sortSess();
  },
  async saveDeloads(d){ await persist({[KEYS.deloads]: d}); S.deloads = d; },
  async saveNotes(n){ await persist({[KEYS.notes]: n}); S.notes = n; },
  async savePlan(p){ await persist({[KEYS.plan]: p}); S.plan = p; },
  async addSession(s){ const all = [s, ...S.sessions.filter(x => x.id !== s.id)]; await persist({[KEYS.sessions]: all}); S.sessions = all; sortSess(); },
  async deleteSession(id){ const all = S.sessions.filter(x => x.id !== id); await persist({[KEYS.sessions]: all}); S.sessions = all; },
  async saveBody(b){ b = b.slice().sort((x, y) => x.date.localeCompare(y.date)); await persist({[KEYS.body]: b}); S.body = b; },
  async replaceAll(d){
    await persist({[KEYS.plan]: d.plan, [KEYS.sessions]: d.sessions, [KEYS.deloads]: d.deloads, [KEYS.notes]: d.notes, [KEYS.body]: d.body});
    S.plan = d.plan; S.sessions = d.sessions; S.deloads = d.deloads; S.notes = d.notes; S.body = d.body; sortSess();
  }
};
const store = localStore;

/* ---------- záloha ---------- */
const BACKUP_FORMAT = 'treninkovy-denik-v1';
function backupData(){
  return {format: BACKUP_FORMAT, exportedAt: ymd(new Date()), plan: S.plan, sessions: S.sessions, deloads: S.deloads, notes: S.notes, body: S.body};
}
function parseBackup(text){
  let d; try { d = JSON.parse(text); } catch(e){ throw new Error('Soubor není platný JSON.'); }
  if (!d || typeof d !== 'object') throw new Error('Soubor neobsahuje zálohu.');
  if (d.format && d.format !== BACKUP_FORMAT) throw new Error('Neznámý formát zálohy: ' + d.format);
  const plan = d.plan && Array.isArray(d.plan.days) ? d.plan : null;
  if (!plan || !Array.isArray(d.sessions)) throw new Error('V souboru chybí plán nebo tréninky.');
  plan.days.forEach(x => { if (!x.id) x.id = rid(); if (!Array.isArray(x.exercises)) x.exercises = []; x.exercises.forEach(e => { if (!e.id) e.id = rid(); if (!Array.isArray(e.alternatives)) e.alternatives = []; }); });
  const sessions = d.sessions.filter(s => s && s.date).map((s, k) => Object.assign({}, s, {id: s.id || ('s' + Date.parse(s.date) + k), entries: Array.isArray(s.entries) ? s.entries : []}));
  const deloads = Array.isArray(d.deloads) ? d.deloads.filter(x => typeof x === 'string') : [];
  let notes = {};
  if (Array.isArray(d.notes)) d.notes.forEach(n => { if (n && n.name && n.text) notes[norm(n.name)] = n.text; });
  else if (d.notes && typeof d.notes === 'object') notes = d.notes;
  const body = Array.isArray(d.body) ? d.body.filter(x => x && /^\d{4}-\d{2}-\d{2}$/.test(x.date) && isFinite(x.kg)).sort((a, b) => a.date.localeCompare(b.date)) : [];
  return {plan, sessions, deloads, notes, body, exportedAt: d.exportedAt || ''};
}
function saveFile(filename, text, mime){
  const blob = new Blob([text], {type: mime});
  // v nainstalované aplikaci na iPhonu je nejspolehlivější systémové „Sdílet“ → „Uložit do Souborů“
  const standalone = window.navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;
  const iOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if (standalone && iOS && navigator.canShare) {
    const file = new File([blob], filename, {type: mime});
    if (navigator.canShare({files: [file]})) return navigator.share({files: [file]}).then(() => true, e => { if (e && e.name === 'AbortError') return false; throw e; });
  }
  const url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
  return Promise.resolve(true);
}
function pickFile(){
  return new Promise(res => {

    inp.type = 'file'; inp.accept = '.json,application/json';

    inp.addEventListener('cancel', () => { inp.remove(); res(null); });
    document.body.appendChild(inp); inp.click();
  });
}

/* ---------- progression logic ---------- */
function historyFor(name, skipDeload){
  const n = norm(name), out = [];
  for (const s of S.sessions) { if (skipDeload && s.deload) continue;
    (s.entries || []).forEach((e, i) => {
      if (norm(e.name) === n && e.sets && e.sets.length) out.push({id: s.id, i, date: s.date, sets: e.sets, note: e.note || '', deload: !!s.deload});
    }); }
  return out; // newest first
}
const e1 = x => (x.w || 0) > 0 ? x.w * (1 + x.r / 30) : 0;            // Epley
const metric = sets => { const b = Math.max(...sets.map(e1)); return b > 0 ? b : Math.max(...sets.map(x => x.r)); };
const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
function weekStart(x){ const d = new Date(x); d.setHours(0,0,0,0); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return d; }
const wkKey = x => ymd(weekStart(x));
const isDeloadWeek = x => S.deloads.includes(wkKey(x));
const GROUPS = ['Hrudník','Záda','Ramena','Biceps','Triceps','Přední stehna','Zadní stehna','Hýždě','Adduktory','Lýtka','Core'];
function prSet(){
  const best = {}, out = new Set();
  for (const s of S.sessions.slice().reverse()) { if (s.deload) continue;
    (s.entries || []).forEach((e, i) => { if (!e.sets || !e.sets.length) return;
      const k = norm(e.name), m = metric(e.sets);
      if (k in best && m > best[k] + 1e-9) out.add(s.id + '|' + i);
      if (!(k in best) || m > best[k]) best[k] = m; }); }
  return out;
}
function weekStreak(){
  const wk = new Set(S.sessions.filter(s => !s.deload).map(s => wkKey(s.date)));
  const d = weekStart(new Date());
  if (!wk.has(ymd(d))) d.setDate(d.getDate() - 7);
  let n = 0;
  while (wk.has(ymd(d)) && !S.deloads.includes(ymd(d))) { n++; d.setDate(d.getDate() - 7); }
  return n;
}
const topW = sets => Math.max(...sets.map(x => x.w || 0));

function suggest(slot, name){
  const nSets = slot.sets || 3, lo = slot.repMin || 8, hi = Math.max(slot.repMax || lo, lo);
  const step = slot.step == null ? 2.5 : slot.step;
  const h = historyFor(name, true);
  if (!h.length) return { kind:'new', last:null,
    msg: `Poprvé – zvol váhu, se kterou dáš ${lo}–${hi} opakování.`,
    sets: Array.from({length:nSets}, () => ({w:null, r:lo})) };
  const last = h[0], top = topW(last.sets);
  if (isDeloadWeek(new Date())) {
    const st = step > 0 ? step : 1, n = Math.max(1, nSets - 1);
    const dw = top > 0 ? r2(Math.round(top * 0.9 / st) * st) : 0;
    return {kind:'deload', last, msg: `Deload týden – ${top > 0 ? kg(dw) + ' kg (asi 90 %), ' : ''}${n} ${n === 1 ? 'série' : n < 5 ? 'série' : 'sérií'} po ${lo} opakováních`,
      sets: Array.from({length:n}, () => ({w: dw, r: lo}))};
  }
  const atTop = last.sets.filter(x => (x.w || 0) === top);
  const allMax = atTop.length >= nSets && atTop.every(x => x.r >= hi);
  let sets, msg, kind;
  if (allMax && step > 0) {
    const w = r2(top + step);
    sets = Array.from({length:nSets}, () => ({w, r:lo}));
    msg = `↑ Minule všechny série na ${hi} – přidej ${kg(step)} kg (${kg(w)} kg)`; kind = 'up';
  } else {
    sets = Array.from({length:nSets}, (_, i) => {
      const prev = (atTop[i] || atTop[atTop.length - 1] || {r:lo}).r;
      return {w: top || (top === 0 ? 0 : null), r: Math.min(hi, Math.max(lo, prev + 1))};
    });
    msg = step > 0 ? `Drž ${kg(top)} kg a přidej opakování – na ${hi} ve všech sériích přijde váha` : `Přidej opakování`;
    kind = 'hold';
  }
  if (h.length >= 3 && kind !== 'up') {
    const tops = h.slice(0,3).map(x => topW(x.sets));
    const reps = h.slice(0,3).map((x,i) => x.sets.filter(s => (s.w || 0) === tops[i]).reduce((a,s) => a + s.r, 0));
    if (tops.every(t => t === tops[0]) && reps[0] <= reps[2]) {
      msg = `3 tréninky bez posunu na ${kg(top)} kg – zkus jinou variantu, nebo uber 10 % a vrať se nahoru`;
      kind = 'stall';
    }
  }
  return {sets, msg, kind, last};
}

function fmtSets(sets){
  const groups = [];
  for (const s of sets) {
    const g = groups[groups.length - 1];
    if (g && g.w === s.w) g.r.push(s.r); else groups.push({w:s.w, r:[s.r]});
  }
  return groups.map(g => (g.w ? `${kg(g.w)} kg × ` : '') + g.r.join(', ')).join(' / ');
}

/* ---------- workout ---------- */
const findDay = id => S.plan.days.find(d => d.id === id);
const findSlot = (day, sid) => day && day.exercises.find(e => e.id === sid);
const saveDraft = () => S.draft ? LS.set('wl-draft', S.draft) : LS.del('wl-draft');

function startWorkout(dayId){
  const day = findDay(dayId); if (!day) return;
  S.draft = { dayId, dayName: day.name, startedAt: new Date().toISOString(),
    items: day.exercises.map(ex => ({ slotId: ex.id, name: ex.name,
      sets: suggest(ex, ex.name).sets.map(s => ({w:s.w, r:s.r, done:false})) })) };
  saveDraft(); render(); window.scrollTo(0,0);
}

function lastDoneOfDay(dayId){ const s = S.sessions.find(x => x.dayId === dayId); return s ? s.date : null; }

const WD = ['pondělí','úterý','středa','čtvrtek','pátek','sobota','neděle'];
function dayWeekday(d){
  if (d.weekday === 0) return null;
  if (d.weekday) return +d.weekday;
  const n = norm(d.name); const k = WD.findIndex(w => n.startsWith(w));
  return k >= 0 ? k + 1 : null;
}
const todayWd = () => ((new Date().getDay() + 6) % 7) + 1;
function nextDay(){
  const days = S.plan.days.filter(d => d.exercises.length); if (!days.length) return null;
  const withWd = days.filter(d => dayWeekday(d));
  if (withWd.length) {
    const t = todayWd();
    const today = withWd.find(d => dayWeekday(d) === t);
    if (today) return {id: today.id, today: true, byWd: true};
    let best = null, bd = 8;
    for (const d of withWd) { const diff = (dayWeekday(d) - t + 7) % 7; if (diff < bd) { bd = diff; best = d; } }
    return {id: best.id, today: false, byWd: true};
  }
  if (!S.sessions.length) return {id: days[0].id, today: true, byWd: false};
  const lastIdx = days.findIndex(d => d.id === S.sessions[0].dayId);
  return {id: days[lastIdx < 0 ? 0 : (lastIdx + 1) % days.length].id, today: true, byWd: false};
}

function vProg(){
  const names = []; const seen = new Set();
  for (const s of S.sessions) for (const e of (s.entries||[])) { const k = norm(e.name); if (!seen.has(k)) { seen.add(k); names.push(e.name); } }
  names.sort((a,b) => a.localeCompare(b, 'cs'));
  if (!S.progName || !seen.has(norm(S.progName))) S.progName = names[0];
  const all = historyFor(S.progName, false);
  const h = all.filter(x => !x.deload).reverse();
  const prs = prSet();
  const useW = h.some(x => topW(x.sets) > 0);
  const pts = h.map(x => metric(x.sets));
  let chart = '';
  if (pts.length >= 2) {
    const W = 600, H = 200, P = 34;
    const mn = Math.min(...pts), mx = Math.max(...pts), span = (mx - mn) || 1;
    const X = i => P + i * (W - P - 12) / (pts.length - 1);
    const Y = v => H - 24 - (v - mn) / span * (H - 48);
    const poly = pts.map((v,i) => `${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' ');
    chart = `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Vývoj ${useW ? 'odhadu maxima' : 'opakování'}">
      <text x="0" y="${Y(mx)+5}" fill="var(--muted)" font-size="14">${kg(Math.round(mx))}</text>
      <text x="0" y="${Y(mn)+5}" fill="var(--muted)" font-size="14">${kg(Math.round(mn))}</text>
      <line x1="${P}" x2="${W-12}" y1="${Y(mn)}" y2="${Y(mn)}" stroke="var(--line)"/>
      <polyline points="${poly}" fill="none" stroke="var(--blue)" stroke-width="3" stroke-linejoin="round"/>
      ${pts.map((v,i) => `<circle cx="${X(i)}" cy="${Y(v)}" r="4.5" fill="var(--blue)"/>`).join('')}
      <text x="${P}" y="${H-4}" fill="var(--muted)" font-size="13">${dShort(h[0].date)}</text>
      <text x="${W-12}" y="${H-4}" fill="var(--muted)" font-size="13" text-anchor="end">${dShort(h[h.length-1].date)}</text>
    </svg><p class="sub">${useW ? 'Odhad maxima na 1 opakování (kg) – počítá s váhou i opakováními nejlepší série' : 'Nejvíc opakování v sérii'}</p></div>`;
  }
  return `<label>Cvik<select data-act="progsel">${names.map(n => `<option${norm(n)===norm(S.progName)?' selected':''}>${esc(n)}</option>`).join('')}</select></label>
    <div class="note-row">${S.notes[norm(S.progName)] ? `<p class="note">${esc(S.notes[norm(S.progName)])}</p>` : ''}<button class="btn small" data-act="note">${S.notes[norm(S.progName)] ? 'Upravit poznámku' : '+ Poznámka ke cviku'}</button></div>
    ${chart}
    ${recTable(S.progName, h, useW)}
    <h2 class="sec-h">Všechny záznamy</h2>
    <div class="tablewrap"><table><thead><tr><th>Datum</th><th>Série</th><th class="num">${useW ? 'Odh. max' : 'Max opak.'}</th></tr></thead><tbody>
    ${all.map(x => `<tr><td>${dShort(x.date)}${x.deload ? '<br><span class="dl-tag">deload</span>' : ''}</td><td>${esc(fmtSets(x.sets))}${prs.has(x.id + '|' + x.i) ? '<span class="pr">Rekord</span>' : ''}${x.note ? `<span class="enote">${esc(x.note)}</span>` : ''}</td>
      <td class="num">${useW ? kg(Math.round(metric(x.sets) * 2) / 2) + ' kg' : metric(x.sets)}</td></tr>`).join('')}
    </tbody></table></div>`;
}

/* rekordy podle počtu opakování: nejtěžší váha, se kterou jsi dal aspoň N opakování */
const curBody = () => S.body.length ? S.body[S.body.length - 1].kg : null;
function recTable(name, h, useW){
  if (!h.length) return '';
  const day = x => new Date(x).toLocaleDateString('cs-CZ');
  if (!useW) {
    let best = null; h.forEach(x => x.sets.forEach(s => { if (!best || s.r > best.r) best = {r: s.r, date: x.date}; }));
    return `<h2 class="sec-h">Rekord</h2><div class="tablewrap"><table><tbody><tr><td>Nejvíc opakování v sérii</td><td class="num"><b>${best.r}</b></td><td class="num">${day(best.date)}</td></tr></tbody></table></div>`;
  }
  const rows = [1, 3, 5, 8, 10, 12, 15].map(n => {
    let best = null; // h je od nejstaršího, ponecháme první dosažení
    h.forEach(x => x.sets.forEach(s => { if (s.r >= n && (s.w || 0) > 0 && (!best || s.w > best.w)) best = {w: s.w, r: s.r, date: x.date}; }));
    return best && {n, ...best};
  }).filter(Boolean);
  const dedup = rows.filter((r, k) => !rows.slice(k + 1).some(o => o.w >= r.w)); // vyřaď řádky, které přebíjí víc opakování
  let e = null; h.forEach(x => x.sets.forEach(s => { const v = e1(s); if (v > 0 && (!e || v > e.v)) e = {v, date: x.date}; }));
  const bw = curBody();
  return `<h2 class="sec-h">Rekordy podle opakování</h2>
    <div class="tablewrap"><table><thead><tr><th>Opakování</th><th class="num">Váha</th><th class="num">Kdy</th></tr></thead><tbody>
    ${dedup.map(r => `<tr><td>${r.n}${r.r > r.n ? ` <span class="sub">(dal jsi ${r.r})</span>` : ''}</td><td class="num"><b>${kg(r.w)} kg</b></td><td class="num">${day(r.date)}</td></tr>`).join('')}
    ${e ? `<tr><td>Odhad maxima (1 opak.)</td><td class="num"><b>${kg(Math.round(e.v * 2) / 2)} kg</b>${bw ? `<br><span class="sub">${kg(Math.round(e.v / bw * 100) / 100)}× tvá hmotnost</span>` : ''}</td><td class="num">${day(e.date)}</td></tr>` : ''}
    </tbody></table></div>`;
}

function vWeeks(){
  const base = weekStart(new Date()); base.setDate(base.getDate() - 56 * S.wkOff);
  const now = new Date();
  const weeks = Array.from({length:8}, (_, i) => { const d = new Date(base); d.setDate(d.getDate() - 7 * i); return d; });
  const byDay = new Set(S.sessions.map(s => ymd(new Date(s.date))));
  const cur = wkKey(now), isDl = S.deloads.includes(cur), streak = weekStreak();
  const status = `<div class="banner"><p>${isDl ? '<b>Tento týden máš deload.</b>' : `<b>Tento týden: běžný trénink.</b> ${streak ? `Bez odlehčení ${streak} ${streak === 1 ? 'týden' : streak < 5 ? 'týdny' : 'týdnů'} v kuse${streak >= 6 ? ' – je čas na deload.' : '.'}` : ''}`}</p>
    <button class="btn small" data-act="deload" data-v="${isDl ? 'off' : 'on'}">${isDl ? 'Zrušit deload' : 'Označit tento týden jako deload'}</button></div>`;
  const hd = `<div class="wk hd"><span></span><span class="cells">${['Po','Út','St','Čt','Pá','So','Ne'].map(x => `<span>${x}</span>`).join('')}</span><span></span></div>`;
  const rows = weeks.map(w => {
    const k = ymd(w);
    const cells = Array.from({length:7}, (_, j) => { const d = new Date(w); d.setDate(d.getDate() + j);
      return `<span class="c${byDay.has(ymd(d)) ? ' on' : ''}${d > now ? ' fut' : ''}" title="${d.toLocaleDateString('cs-CZ')}"></span>`; }).join('');
    const cnt = S.sessions.filter(s => wkKey(s.date) === k).length;
    return `<div class="wk"><span>${dShort(w)}</span><span class="cells">${cells}</span><span class="wc">${cnt}×${S.deloads.includes(k) ? ' <span class="dl-tag">deload</span>' : ''}</span></div>`;
  }).join('');
  const w4 = weeks.slice(0, 4).reverse();
  const slotGroup = {}; S.plan.days.forEach(d => d.exercises.forEach(e => { slotGroup[e.id] = e.group || ''; }));
  const tab = {};
  S.sessions.forEach(s => { const i = w4.findIndex(w => ymd(w) === wkKey(s.date)); if (i < 0) return;
    (s.entries || []).forEach(e => { const g = slotGroup[e.slotId] || 'Nezařazeno'; (tab[g] = tab[g] || [0,0,0,0])[i] += e.sets.length; }); });
  const order = [...GROUPS, 'Nezařazeno'].filter(g => tab[g]);
  const table = order.length ? `<div class="tablewrap"><table><thead><tr><th>Partie</th>${w4.map(w => `<th class="num">${dShort(w)}</th>`).join('')}</tr></thead><tbody>
    ${order.map(g => `<tr><td>${esc(g)}</td>${tab[g].map(v => `<td class="num">${v || '–'}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`
    : `<p class="sub">V těchto 4 týdnech nejsou žádné série.</p>`;
  return `${S.wkOff === 0 ? status : ''}
    <div class="pager"><button class="btn small" data-act="wkoff" data-d="1">← Starší</button>${S.wkOff ? '<button class="btn small" data-act="wkoff" data-d="-1">Novější →</button>' : ''}</div>
    <div class="cal">${hd}${rows}</div>
    <h2 class="sec-h">Série na partii za týden</h2>${table}
    <p class="sub" style="margin-top:8px">Týdny začínají pondělím. Partii nastavíš u cviku v Plánu, varianty se počítají k partii hlavního cviku.</p>`;
}

/* ---------- přehled ---------- */
const DAY = 864e5;
const sessVol = s => (s.entries || []).reduce((a, e) => a + (e.sets || []).reduce((b, x) => b + (x.w || 0) * (x.r || 0), 0), 0);
const fmtVol = v => v >= 1000 ? kg(Math.round(v / 100) / 10) + ' t' : Math.round(v) + ' kg';
const pct = v => (v > 0.05 ? '+' : v < -0.05 ? '−' : '±') + String(Math.abs(Math.round(v * 10) / 10)).replace('.', ',') + ' %';
const plural = (n, a, b, c) => n === 1 ? a : n > 1 && n < 5 ? b : c;
const r1 = v => kg(Math.round(v * 10) / 10);
// posledních n týdnů (pondělky), nejstarší první, poslední = tento týden
function weekList(n){ const base = weekStart(new Date()); return Array.from({length:n}, (_, i) => { const d = new Date(base); d.setDate(d.getDate() - 7 * (n - 1 - i)); return d; }); }
const firstWeekKey = () => S.sessions.length ? wkKey(S.sessions[S.sessions.length - 1].date) : wkKey(new Date());
const weeksSinceFirst = () => Math.round((weekStart(new Date()) - new Date(firstWeekKey() + 'T00:00:00')) / (7 * DAY)) + 1;
// dokončené týdny od prvního tréninku (bez probíhajícího a bez deloadů), nejnovější poslední
function fullWeeks(max){ const fw = firstWeekKey(); return weekList(max + 1).slice(0, -1).map(ymd).filter(k => k >= fw && !S.deloads.includes(k)); }
function slotGroups(){ const m = {}; S.plan.days.forEach(d => d.exercises.forEach(e => { m[e.id] = e.group || ''; })); return m; }
const plannedPerWeek = () => S.plan.days.filter(d => d.exercises.length).length;

function groupAvg(){
  let wks = fullWeeks(4), partial = false;
  if (!wks.length) { wks = [wkKey(new Date())]; partial = true; }
  const sg = slotGroups(), tot = {};
  S.sessions.forEach(s => { if (s.deload || !wks.includes(wkKey(s.date))) return;
    (s.entries || []).forEach(e => { const g = sg[e.slotId] || 'Nezařazeno'; tot[g] = (tot[g] || 0) + e.sets.length; }); });
  const planned = new Set(Object.values(sg).filter(Boolean));
  const groups = [...GROUPS.filter(g => planned.has(g) || tot[g]), ...(tot['Nezařazeno'] ? ['Nezařazeno'] : [])];
  return {weeks: wks.length, partial, rows: groups.map(g => ({g, v: (tot[g] || 0) / wks.length}))};
}

function progList(){
  const now = Date.now(), win = 56 * DAY, names = [], seen = new Set();
  const add = n => { const k = norm(n); if (n && !seen.has(k)) { seen.add(k); names.push(n); } };
  S.plan.days.forEach(d => d.exercises.forEach(e => add(e.name)));
  S.sessions.forEach(s => (s.entries || []).forEach(e => add(e.name)));
  return names.map(name => {
    const h = historyFor(name, true).reverse(); // nejstarší první
    if (!h.length || now - Date.parse(h[h.length - 1].date) > win) return null;
    // výchozí bod: první záznam v okně, případně poslední před ním (nejvýš 12 týdnů staré)
    let bi = h.findIndex(x => now - Date.parse(x.date) < win);
    if (bi > 0 && now - Date.parse(h[bi - 1].date) < 84 * DAY) bi--;
    const pts = h.slice(bi), base = pts[0], last = pts[pts.length - 1];
    const m0 = metric(base.sets), m1 = metric(last.sets);
    return {name, pts: pts.map(x => metric(x.sets)), ch: pts.length >= 2 && m0 > 0 ? (m1 - m0) / m0 * 100 : null,
      days: Math.round((Date.parse(last.date) - Date.parse(base.date)) / DAY), useW: topW(last.sets) > 0, last: m1};
  }).filter(Boolean);
}

function barChart(wks, vals, line, label){
  const n = wks.length, cur = wkKey(new Date()), mx = Math.max(...vals, line || 0, 1);
  const W = 600, H = 180, B = 34, T = 8, gap = n > 8 ? 10 : 16, bw = (W - gap * (n - 1)) / n;
  const Y = v => H - B - v / mx * (H - B - T);
  const bars = vals.map((v, i) => { const k = ymd(wks[i]), x = i * (bw + gap), y = Math.min(Y(v), v ? H - B - 3 : H - B);
    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${(H - B - y).toFixed(1)}" rx="4" fill="${S.deloads.includes(k) ? 'var(--yellow)' : 'var(--blue)'}"${k === cur ? ' opacity=".4"' : ''}/>`
      + (n <= 6 || i % 2 === (n - 1) % 2 ? `<text x="${(x + bw / 2).toFixed(1)}" y="${H - 8}" font-size="21" fill="var(--muted)" text-anchor="middle">${dShort(wks[i])}</text>` : ''); }).join('');
  const ln = line ? `<line x1="0" x2="${W}" y1="${Y(line).toFixed(1)}" y2="${Y(line).toFixed(1)}" stroke="var(--ink)" stroke-opacity=".55" stroke-dasharray="7 6" stroke-width="2"/>` : '';
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}"><line x1="0" x2="${W}" y1="${H - B}" y2="${H - B}" stroke="var(--line)"/>${bars}${ln}</svg>`;
}
const legend = (line) => `<div class="legend"><span><i style="background:var(--blue);opacity:.4"></i>probíhající týden</span><span><i style="background:var(--yellow)"></i>deload</span>${line ? `<span><i style="height:0;border-top:2px dashed var(--ink);opacity:.6;border-radius:0"></i>${line}</span>` : ''}</div>`;

function volCard(){
  const wks = weekList(Math.min(12, Math.max(4, weeksSinceFirst())));
  const vals = wks.map(w => { const k = ymd(w); return S.sessions.filter(s => wkKey(s.date) === k).reduce((a, s) => a + sessVol(s), 0); });
  const full = fullWeeks(12), fv = full.map(k => vals[wks.findIndex(w => ymd(w) === k)] || 0).filter(v => v > 0);
  const avg = fv.length ? fv.reduce((a, b) => a + b, 0) / fv.length : 0;
  return `<section class="card"><h2>Objem po týdnech</h2>
    <p class="sub">Tento týden <b>${fmtVol(vals[vals.length - 1])}</b>${avg ? ` · průměr týdne s tréninkem <b>${fmtVol(avg)}</b>` : ''}. Objem = váha × opakování ve všech sériích.</p>
    ${barChart(wks, vals, avg, 'Objem po týdnech')}${legend(avg ? 'průměr' : '')}</section>`;
}

function groupCard(){
  const G = groupAvg(); if (!G.rows.length) return '';
  const mx = Math.max(22, ...G.rows.map(r => r.v)), pc = v => (v / mx * 100).toFixed(1) + '%';
  return `<section class="card"><h2>Série na partii za týden</h2>
    <p class="sub">${G.partial ? 'Zatím jen probíhající týden – po prvním celém týdnu tu bude týdenní průměr.' : `Průměr za ${G.weeks === 1 ? 'poslední dokončený týden' : 'poslední ' + G.weeks + ' dokončené týdny'} (bez deloadů).`}</p>
    <div class="gb">${G.rows.map(r => { const c = G.partial ? '' : r.v < 10 ? 'lo' : r.v > 20 ? '' : 'ok';
      return `<div class="gb-row"><span>${esc(r.g)}</span><span class="gb-track"><span class="gb-band" style="left:${pc(10)};width:${pc(10)}"></span><span class="gb-bar ${c}" style="width:${pc(r.v)}"></span></span><span class="gb-v">${r1(r.v)}</span></div>`; }).join('')}</div>
    <p class="sub">Světlé pásmo = 10–20 sérií týdně, běžné doporučení pro růst svalů.${G.partial ? '' : ' Žlutě partie pod 10.'} Partii nastavíš u cviku v Plánu.</p></section>`;
}

function spark(pts, cls){
  if (pts.length < 2) return '<span class="spark"></span>';
  const W = 100, H = 30, mn = Math.min(...pts), mx = Math.max(...pts), sp = (mx - mn) || 1;
  const P = pts.map((v, i) => `${(3 + i * (W - 6) / (pts.length - 1)).toFixed(1)},${(mn === mx ? H / 2 : H - 3 - (v - mn) / sp * (H - 6)).toFixed(1)}`).join(' ');
  return `<svg class="spark ${cls}" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><polyline points="${P}" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>`;
}
function progCard(){
  const L = progList(); if (!L.length) return '';
  const span = d => d < 7 ? 'za ' + d + ' ' + plural(d, 'den', 'dny', 'dní') : 'za ' + Math.round(d / 7) + ' ' + plural(Math.round(d / 7), 'týden', 'týdny', 'týdnů');
  return `<section class="card"><h2>Progres cviků</h2>
    <p class="sub">Změna odhadu maxima za posledních 8 týdnů (u cviků bez váhy počet opakování), bez deloadů. Klepni na cvik pro detail.</p>
    <div class="pl">${L.map(p => { const cls = p.ch == null ? '' : p.ch > 1 ? 'up' : p.ch < -1 ? 'down' : '';
      return `<button class="pl-row" data-act="goprog" data-n="${esc(p.name)}"><span class="pl-name">${esc(p.name)}<span class="sub">${p.useW ? 'odh. max ' + kg(Math.round(p.last * 2) / 2) + ' kg' : p.last + ' opak.'}</span></span>${spark(p.pts, cls)}<span class="pl-ch ${cls}">${p.ch == null ? '–' : pct(p.ch)}<span class="sub">${p.ch == null ? '1 záznam' : span(p.days)}</span></span></button>`; }).join('')}</div></section>`;
}

function freqCard(){
  const planned = plannedPerWeek();
  const wks = weekList(Math.min(8, Math.max(4, weeksSinceFirst())));
  const cnt = wks.map(w => S.sessions.filter(s => wkKey(s.date) === ymd(w)).length);
  const full = fullWeeks(4), done = full.reduce((a, k) => a + S.sessions.filter(s => wkKey(s.date) === k).length, 0), target = planned * full.length;
  const txt = full.length && target
    ? `Za ${full.length === 1 ? 'poslední týden' : 'poslední ' + full.length + ' týdny'} <b>${done} z ${target}</b> plánovaných tréninků (${Math.round(done / target * 100)} %).`
    : `Tento týden zatím <b>${cnt[cnt.length - 1]}${planned ? ' z ' + planned : ''}</b> ${plural(planned || cnt[cnt.length - 1], 'trénink', 'tréninky', 'tréninků')}.`;
  return `<section class="card"><h2>Pravidelnost</h2><p class="sub">${txt}</p>
    ${barChart(wks, cnt, planned, 'Počet tréninků za týden')}${legend(planned ? 'plán (' + planned + ' týdně)' : '')}</section>`;
}

function recs(){
  const R = [], now = Date.now(), dl = isDeloadWeek(new Date());
  const list = a => a.length <= 3 ? a.join(', ') : a.slice(0, 3).join(', ') + ' a ' + (a.length - 3) + (a.length - 3 < 5 ? ' další' : ' dalších');
  const dlBtn = '<button class="btn small" data-act="deload" data-v="on">Tento týden deload</button>';
  // únava: pokles výkonu u více cviků naráz
  const recent = progList().filter(p => p.pts.length >= 2 && now - Date.parse(historyFor(p.name, true)[0].date) < 14 * DAY);
  const drops = recent.filter(p => p.pts[p.pts.length - 1] < p.pts[p.pts.length - 2] * 0.98).map(p => p.name);
  let tired = false;
  if (!dl && drops.length >= 3 && drops.length >= recent.length * 0.4) {
    tired = true;
    R.push({k:'warn', t:'Možná únava', x:`Výkon naposledy klesl u ${drops.length} cviků (${list(drops)}). Zvaž odlehčený týden – lehčí váhy a o sérii méně.`, btn: dlBtn});
  }
  if (!dl && !tired && weekStreak() >= 6) R.push({k:'warn', t:'Čas na deload', x:`Trénuješ ${weekStreak()} týdnů v kuse bez odlehčení. Týden s lehčími vahami pomůže regeneraci a dalšímu progresu.`, btn: dlBtn});
  // stagnace
  if (!dl) {
    const st = [];
    S.plan.days.forEach(d => d.exercises.forEach(e => [e.name, ...(e.alternatives || [])].forEach(n => {
      const h = historyFor(n, true);
      if (h.length >= 3 && now - Date.parse(h[0].date) < 42 * DAY && !st.some(x => norm(x) === norm(n)) && suggest(e, n).kind === 'stall') st.push(n);
    })));
    if (st.length) R.push({k:'warn', t:'Stagnace', x:`${list(st)} – 3 tréninky bez posunu. Zkus jinou variantu cviku, nebo uber asi 10 % a vrať se nahoru.`});
  }
  // vynechávané cviky
  const missed = [];
  S.plan.days.forEach(d => { const rs = S.sessions.filter(s => s.dayId === d.id && now - Date.parse(s.date) < 28 * DAY); if (rs.length < 2) return;
    d.exercises.forEach(e => { if (!rs.some(s => (s.entries || []).some(x => x.slotId === e.id))) missed.push(e.name); }); });
  if (missed.length) R.push({k:'info', t:'Vynechávané cviky', x:`${list(missed)} – v posledních trénincích daného dne chybí. Pokud je nechceš dělat, uprav Plán; jinak je zkus zařadit hned na začátek.`});
  // partie
  const G = groupAvg();
  const activeWeeks = fullWeeks(4).filter(k => S.sessions.some(s => wkKey(s.date) === k)).length;
  if (!G.partial && activeWeeks >= 2) {
    const rows = G.rows.filter(r => r.g !== 'Nezařazeno');
    const low = rows.filter(r => r.v < 10), high = rows.filter(r => r.v > 20);
    if (low.length) R.push({k:'info', t:'Málo sérií na partii', x:`Pod 10 sérií týdně: ${list(low.map(r => r.g + ' (' + r1(r.v) + ')'))}. Pro růst se běžně doporučuje aspoň 10 sérií na partii za týden – přidej sérii nebo cvik.`});
    if (high.length) R.push({k:'info', t:'Hodně sérií na partii', x:`Přes 20 sérií týdně: ${list(high.map(r => r.g + ' (' + r1(r.v) + ')'))}. Nad 20 sérií už přínos roste málo a přibývá únavy.`});

  return R;
}

function sumCard(){
  const now = new Date(); let from, to, label, pFrom;
  if (S.sumMode === 'y') { const y = now.getFullYear() - S.sumOff; from = new Date(y, 0, 1); to = new Date(y + 1, 0, 1); pFrom = new Date(y - 1, 0, 1); label = 'Rok ' + y; }
  else { from = new Date(now.getFullYear(), now.getMonth() - S.sumOff, 1); to = new Date(from.getFullYear(), from.getMonth() + 1, 1); pFrom = new Date(from.getFullYear(), from.getMonth() - 1, 1);
    label = from.toLocaleDateString('cs-CZ', {month: 'long', year: 'numeric'}); label = label[0].toUpperCase() + label.slice(1); }
  const inR = (s, a, b) => { const d = new Date(s.date); return d >= a && d < b; };
  // u probíhajícího období porovnej se stejně dlouhým začátkem předchozího
  const pTo = S.sumOff ? from : new Date(pFrom.getTime() + (now - from));
  const ss = S.sessions.filter(s => inR(s, from, to)), prev = S.sessions.filter(s => inR(s, pFrom, pTo));
  const vol = ss.reduce((a, s) => a + sessVol(s), 0), pvol = prev.reduce((a, s) => a + sessVol(s), 0);
  let sets = 0, reps = 0; const cnt = {};
  ss.forEach(s => (s.entries || []).forEach(e => { sets += e.sets.length; reps += e.sets.reduce((a, x) => a + (x.r || 0), 0); cnt[e.name] = (cnt[e.name] || 0) + e.sets.length; }));
  const prs = prSet(); let prN = 0; ss.forEach(s => (s.entries || []).forEach((e, i) => { if (prs.has(s.id + '|' + i)) prN++; }));
  const durs = ss.map(s => s.startedAt ? (Date.parse(s.date) - Date.parse(s.startedAt)) / 60000 : 0).filter(m => m >= 10 && m <= 300);
  const top = Object.entries(cnt).sort((a, b) => b[1] - a[1])[0];
  const wks = new Set(ss.map(s => wkKey(s.date))).size;
  const tile = (v, l) => `<div class="stat"><b>${v}</b><span>${l}</span></div>`;
  const nav = `<div class="sum-nav"><div class="seg" style="margin:0"><button data-act="summode" data-v="m" aria-pressed="${S.sumMode === 'm'}">Měsíc</button><button data-act="summode" data-v="y" aria-pressed="${S.sumMode === 'y'}">Rok</button></div>
    <span><button class="btn small" data-act="sumoff" data-d="1" aria-label="Předchozí">←</button> <button class="btn small" data-act="sumoff" data-d="-1" aria-label="Další"${S.sumOff ? '' : ' disabled style="opacity:.4"'}>→</button></span></div>`;
  return `<section class="card"><h2>Souhrn</h2>${nav}<h3>${esc(label)}</h3>
    ${ss.length ? `<div class="stats">
      ${tile(ss.length, plural(ss.length, 'trénink', 'tréninky', 'tréninků') + (wks ? ` · ${wks} ${plural(wks, 'týden', 'týdny', 'týdnů')}` : ''))}
      ${tile(fmtVol(vol), 'objem' + (pvol ? ` · ${pct((vol - pvol) / pvol * 100)} oproti ${S.sumMode === 'y' ? (S.sumOff ? 'předchozímu roku' : 'stejné době loni') : (S.sumOff ? 'předchozímu měsíci' : 'stejné době minulého měsíce')}` : ''))}
      ${tile(sets, plural(sets, 'série', 'série', 'sérií') + ` · ${reps} opakování`)}
      ${tile(prN, plural(prN, 'nový rekord', 'nové rekordy', 'nových rekordů'))}
      ${durs.length ? tile(Math.round(durs.reduce((a, b) => a + b, 0) / durs.length) + ' min', 'průměrná délka tréninku') : ''}
      ${top ? tile(esc(top[0]), `nejčastější cvik · ${top[1]} ${plural(top[1], 'série', 'série', 'sérií')}`) : ''}
    </div>` : '<p class="sub">V tomto období není žádný trénink.</p>'}</section>`;
}

/* ---------- export do kalendáře (.ics) ---------- */
const CAL_DEF = {time: '17:00', dur: 75};
const dayTitle = d => { const n = String(d.name || '').trim(), k = WD.find(w => norm(n).startsWith(w));
  return (k ? n.slice(k.length).replace(/^\s*[–—\-:,]\s*/, '').trim() : n) || n || 'Trénink'; };
const appUrl = () => location.origin + location.pathname.replace(/index\.html$/, '');
const icsEsc = s => String(s).replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n');
function icsFold(line){
  const enc = new TextEncoder(), parts = []; let cur = '', n = 0, lim = 75;
  for (const ch of line) { const b = enc.encode(ch).length; if (n + b > lim) { parts.push(cur); cur = ''; n = 0; lim = 74; } cur += ch; n += b; }
  parts.push(cur); return parts.join('\r\n ');
}
function calRange(period, startIso){
  const from = new Date(startIso + 'T00:00:00'), to = new Date(from);
  if (period === 'w') to.setDate(to.getDate() + 7); else if (period === 'm') to.setMonth(to.getMonth() + 1); else to.setFullYear(to.getFullYear() + 1);
  const days = S.plan.days.filter(d => d.exercises.length && dayWeekday(d)), ev = [];
  for (const t = new Date(from); t < to; t.setDate(t.getDate() + 1)) {
    const wd = ((t.getDay() + 6) % 7) + 1;
    days.filter(d => dayWeekday(d) === wd).forEach(d => ev.push({day: d, date: new Date(t)}));
  }
  const last = new Date(to); last.setDate(last.getDate() - 1);
  return {ev, from, last};
}
function buildIcs(ev, rem, loc){
  const p2 = n => String(n).padStart(2, '0');
  const stamp = new Date().toISOString().replace(/[-:]/g, '').slice(0, 15) + 'Z';
  const local = d => `${d.getFullYear()}${p2(d.getMonth() + 1)}${p2(d.getDate())}T${p2(d.getHours())}${p2(d.getMinutes())}00`;
  const url = appUrl();
  const L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Treninkovy denik//CS', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH', 'X-WR-CALNAME:Trénink'];
  ev.forEach(({day, date}) => {
    const [hh, mm] = (day.time || CAL_DEF.time).split(':').map(Number);
    const st = new Date(date); st.setHours(hh || 0, mm || 0, 0, 0);
    const en = new Date(st.getTime() + (day.duration || CAL_DEF.dur) * 60000);
    const title = '🏋️ ' + dayTitle(day);
    const desc = day.exercises.map(e => `${e.name} – ${e.sets}× ${e.repMin === e.repMax ? e.repMin : e.repMin + '–' + e.repMax}${(e.alternatives || []).length ? ' (alt.: ' + e.alternatives.join(', ') + ')' : ''}`).join('\n') + `\n\nOtevřít deník: ${url}`;
    L.push('BEGIN:VEVENT', `UID:${day.id}-${ymd(date).replace(/-/g, '')}@treninkovy-denik`, `DTSTAMP:${stamp}`, `DTSTART:${local(st)}`, `DTEND:${local(en)}`,
      `SUMMARY:${icsEsc(title)}`, `DESCRIPTION:${icsEsc(desc)}`, `URL:${url}`);
    if (loc) L.push(`LOCATION:${icsEsc(loc)}`);
    if (rem > 0) L.push('BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:${icsEsc(title)}`, `TRIGGER:-PT${rem}M`, 'END:VALARM');
    L.push('END:VEVENT');
  });
  L.push('END:VCALENDAR');
  return L.map(icsFold).join('\r\n') + '\r\n';
}

  S.pending = false;
  if (!S.ready) return;
  app.innerHTML = S.view === 'train' ? vTrain() : S.view === 'over' ? vOver() : S.view === 'hist' ? vHist() : vPlan();
  overlay.innerHTML = vSheet();
  document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-current', b.dataset.v === S.view ? 'page' : 'false'));
}
app.addEventListener('focusout', () => setTimeout(() => { if (S.pending) render(); }, 0));

let toastT;
function toast(msg, ms){
  let t = document.querySelector('.toast'); if (!t) { t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role','status'); document.body.appendChild(t); }
  t.textContent = msg; clearTimeout(toastT); toastT = setTimeout(() => t.remove(), ms || 2600);
}

function askConfirm(msg, okLabel){
  return new Promise(res => {
    const el = document.createElement('div');
    el.className = 'cf';
    el.innerHTML = `<div class="cf-box" role="alertdialog" aria-modal="true"><p>${esc(msg)}</p><div class="cf-btns"><button class="btn" data-cf="0">Zpět</button><button class="btn primary" data-cf="1">${esc(okLabel || 'Ano')}</button></div></div>`;
    const close = v => { el.remove(); res(v); };
    el.addEventListener('click', e => { e.stopPropagation(); const b = e.target.closest('[data-cf]'); if (b) close(b.dataset.cf === '1'); else if (e.target === el) close(false); });
    document.body.appendChild(el);
    el.querySelector('[data-cf="1"]').focus();
  });
}

function askText(title, value, hint, ph){
  return new Promise(res => {
    const el = document.createElement('div');
    el.className = 'cf';
    el.innerHTML = `<div class="cf-box" role="dialog" aria-modal="true"><h2>${esc(title)}</h2><textarea rows="4" placeholder="${esc(ph || 'Např. sedadlo na 4, úzký úchop, stroj u okna')}">${esc(value)}</textarea><p class="sub">${esc(hint || 'Poznámka zůstane u cviku, dokud ji nezměníš. Prázdná poznámka se smaže.')}</p><div class="cf-btns"><button class="btn" data-cf="0">Zrušit</button><button class="btn primary" data-cf="1">Uložit</button></div></div>`;
    const ta = el.querySelector('textarea');
    const close = v => { el.remove(); res(v); };
    el.addEventListener('click', e => { e.stopPropagation(); const b = e.target.closest('[data-cf]'); if (b) close(b.dataset.cf === '1' ? ta.value.trim() : null); else if (e.target === el) close(null); });
    document.body.appendChild(el);
    ta.focus();
  });
}

/* ---------- events ---------- */
document.addEventListener('click', async ev => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act, i = +b.dataset.i, j = +b.dataset.s;
  if (a === 'closesheet' && ev.target !== b) return;
  const D = S.draft;
  switch (a) {
    case 'tab':
      if (S.view === 'plan' && b.dataset.v !== 'plan' && planDirty() && !(await askConfirm('Plán má neuložené změny. Odejít bez uložení?', 'Odejít'))) return;
      if (b.dataset.v !== 'plan') S.planDraft = null;
      S.view = b.dataset.v; render(); window.scrollTo(0,0); break;
    case 'start': startWorkout(b.dataset.id); break;
    case 'inc': {
      const s = D.items[i].sets[j], day = findDay(D.dayId), slot = findSlot(day, D.items[i].slotId);
      const d = +b.dataset.d;
      if (b.dataset.f === 'w') { const st = (slot && slot.step) || 2.5; s.w = Math.max(0, r2((s.w || 0) + d * st)); }
      else s.r = Math.max(0, (s.r || 0) + d);
      saveDraft(); render(); break; }
    case 'done': {
      const it = D.items[i], s = it.sets[j];
      s.done = !s.done;
      if (s.done && j + 1 < it.sets.length && it.sets[j+1].w == null) it.sets[j+1].w = s.w;
      saveDraft(); render(); break; }
    case 'addset': { const it = D.items[i], l = it.sets[it.sets.length - 1] || {w:null, r:8}; it.sets.push({w:l.w, r:l.r, done:false}); saveDraft(); render(); break; }
    case 'rmset': D.items[i].sets.pop(); saveDraft(); render(); break;
    case 'variant': S.sheet = {i}; render(); break;
    case 'closesheet': S.sheet = null; render(); break;
    case 'pickvar': case 'addvar': {
      const it = D.items[S.sheet.i], day = findDay(D.dayId), slot = findSlot(day, it.slotId);
      let name;
      if (a === 'pickvar') name = b.textContent.replace('(hlavní)', '').trim();
      else { name = (document.getElementById('newvar').value || '').trim(); if (!name) return; }
      if (norm(name) !== norm(it.name)) {
        if (it.sets.some(s => s.done) && !(await askConfirm('Některé série už máš odškrtnuté. Přepnout cvik a začít ho znovu?', 'Přepnout'))) return;
        it.name = name;
        const sg = suggest(slot || {sets: it.sets.length}, name);
        it.sets = sg.sets.map(s => ({w:s.w, r:s.r, done:false}));
      }
      S.sheet = null; saveDraft();
      if (a === 'addvar' && slot && norm(name) !== norm(slot.name) && !(slot.alternatives||[]).some(x => norm(x) === norm(name))) {
        const p = clone(S.plan); const ps = findSlotIn(p, D.dayId, it.slotId);
        if (ps) { ps.alternatives = [...(ps.alternatives||[]), name]; try { await store.savePlan(p); } catch(e){} }
      }
      render(); break; }
    case 'discard': if (await askConfirm('Zahodit rozpracovaný trénink? Zapsané série se neuloží.', 'Zahodit')) { S.draft = null; saveDraft(); render(); } break;
    case 'finish': {
      let entries = D.items.map(it => ({slotId: it.slotId, name: it.name,
        sets: it.sets.filter(s => s.done && s.r > 0).map(s => ({w: s.w == null ? 0 : s.w, r: s.r}))})).filter(e => e.sets.length);
      if (!entries.length) {
        if (!(await askConfirm('Nemáš odškrtnutou žádnou sérii. Uložit všechny vyplněné série?', 'Uložit'))) return;
        entries = D.items.map(it => ({slotId: it.slotId, name: it.name,
          sets: it.sets.filter(s => s.r > 0).map(s => ({w: s.w == null ? 0 : s.w, r: s.r}))})).filter(e => e.sets.length);
        if (!entries.length) { toast('Není co uložit – vyplň aspoň jednu sérii.'); return; }
      }
      entries.forEach(e => { const it = D.items.find(x => x.slotId === e.slotId && x.name === e.name); if (it && it.todayNote) e.note = it.todayNote; });
      const sess = {id: 's' + Date.now(), date: new Date().toISOString(), startedAt: D.startedAt, dayId: D.dayId, dayName: D.dayName, entries};
      if (isDeloadWeek(new Date())) sess.deload = true;
      const prs = sess.deload ? [] : entries.filter(e => { const h = historyFor(e.name, true);
        return h.length && metric(e.sets) > Math.max(...h.map(x => metric(x.sets))) + 1e-9; }).map(e => e.name);
      b.disabled = true;
      try { await store.addSession(sess); S.draft = null; saveDraft(); S.view = 'hist'; S.histTab = 'list'; render(); window.scrollTo(0,0);
        toast(prs.length ? 'Trénink uložen. Nový rekord: ' + prs.join(', ') : 'Trénink uložen', prs.length ? 6000 : 2600); }
      catch(e){ b.disabled = false; toast('Uložení se nepovedlo – zkus to znovu.'); }
      break; }
    case 'htab': S.histTab = b.dataset.v; S.wkOff = 0; render(); break;
    case 'tnote': {
      const it = S.draft.items[+b.dataset.i];
      const v = await askText('Dnes – ' + it.name, it.todayNote || '', 'Uloží se jen k dnešnímu tréninku. Příště ji uvidíš u řádku „Minule“.', 'Např. bolelo rameno, poslední série s dopomocí');
      if (v === null) break;
      it.todayNote = v; saveDraft(); render();
      break; }
    case 'note': {
      const name = b.dataset.i != null ? S.draft.items[+b.dataset.i].name : S.progName;
      if (!name) break;
      const v = await askText('Poznámka – ' + name, S.notes[norm(name)] || '');
      if (v === null) break;
      const nn = Object.assign({}, S.notes);
      if (v) nn[norm(name)] = v; else delete nn[norm(name)];
      try { await store.saveNotes(nn); render(); toast(v ? 'Poznámka uložena' : 'Poznámka smazána'); }
      catch(e){ toast('Uložení se nepovedlo – zkus to znovu.'); }
      break; }
    case 'goprog': S.view = 'hist'; S.histTab = 'prog'; S.progName = b.dataset.n; render(); window.scrollTo(0,0); break;
    case 'wkoff': S.wkOff = Math.max(0, S.wkOff + (+b.dataset.d)); render(); break;
    case 'deload': {
      const k = wkKey(new Date());
      const nd = b.dataset.v === 'on' ? [...new Set([...S.deloads, k])] : S.deloads.filter(x => x !== k);
      try { await store.saveDeloads(nd); render(); toast(b.dataset.v === 'on' ? 'Tento týden je deload' : 'Deload zrušen'); }
      catch(e){ toast('Uložení se nepovedlo – zkus to znovu.'); }
      break; }
    case 'backup':
      try { if (await saveFile('treninkovy-denik-' + ymd(new Date()) + '.json', JSON.stringify(backupData(), null, 1), 'application/json')) { LS.set('wl-lastBackup', ymd(new Date())); LS.del('wl-backupSnooze'); render(); } }
      catch(e){ toast('Stažení zálohy se nepovedlo.'); }
      break;
    case 'bsnooze': { const d = new Date(); d.setDate(d.getDate() + 3); LS.set('wl-backupSnooze', ymd(d)); render(); break; }
    case 'aslast': {
      const idx = i < 0 ? D.items.map((_, k) => k) : [i];
      const its = idx.map(k => D.items[k]).filter(it => historyFor(it.name, true).length);
      if (!its.length) break;
      if (its.some(it => it.sets.some(s => s.done)) && !(await askConfirm(i < 0 ? 'Některé série už máš odškrtnuté. Přepsat všechny cviky podle minulého tréninku?' : 'Některé série už máš odškrtnuté. Přepsat je podle minula?', 'Přepsat'))) break;
      its.forEach(it => { it.sets = historyFor(it.name, true)[0].sets.map(s => ({w: s.w, r: s.r, done: false})); });
      saveDraft(); render(); toast(i < 0 ? 'Vyplněno podle minulého tréninku' : 'Vyplněno podle minula'); break; }
    case 'bwadd': {
      const inp = document.getElementById('bw-in'), v = num(inp && inp.value);
      if (v == null || v < 25 || v > 350) { toast('Zadej hmotnost v kg, např. 82,5'); break; }
      const today = ymd(new Date());
      try { await store.saveBody([...S.body.filter(x => x.date !== today), {date: today, kg: r2(v)}]); render(); toast('Hmotnost zapsána'); }
      catch(e){ toast('Uložení se nepovedlo – zkus to znovu.'); }
      break; }
    case 'bwdel':
      if (await askConfirm(`Smazat záznam hmotnosti z ${new Date(b.dataset.d + 'T12:00').toLocaleDateString('cs-CZ')}?`, 'Smazat')) {
        try { await store.saveBody(S.body.filter(x => x.date !== b.dataset.d)); render(); } catch(e){ toast('Smazání se nepovedlo.'); } }
      break;
    case 'summode': S.sumMode = b.dataset.v; S.sumOff = 0; render(); break;
    case 'sumoff': S.sumOff = Math.max(0, S.sumOff + (+b.dataset.d)); render(); break;
    case 'calexp':
      if (planDirty()) { toast('Nejdřív ulož změny v plánu.'); break; }
      calDialog(); break;
    case 'restore': restoreBackup(); break;
    case 'export': {
      const rows = [['Datum','Trénink','Cvik','Série','Váha (kg)','Opakování','Odhad max (kg)','Deload','Poznámka']];
      S.sessions.slice().reverse().forEach(s => (s.entries || []).forEach(e => e.sets.forEach((x, n) =>
        rows.push([new Date(s.date).toLocaleDateString('cs-CZ'), s.dayName, e.name, n + 1, kg(x.w || 0), x.r, x.w ? kg(Math.round(e1(x) * 10) / 10) : '', s.deload ? 'ano' : '', n === 0 ? (e.note || '') : '']))));
      const csv = '\ufeff' + rows.map(r => r.map(v => { v = String(v); return /[;"\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }).join(';')).join('\r\n');
      try { await saveFile('treninkovy-denik-' + ymd(new Date()) + '.csv', csv, 'text/csv;charset=utf-8'); }
      catch(e){ toast('Export se nepovedl.'); }
      break; }
    case 'delsess':
      if (await askConfirm('Smazat tento trénink z historie?', 'Smazat')) { try { await store.deleteSession(b.dataset.id); render(); toast('Smazáno'); } catch(e){ toast('Smazání se nepovedlo.'); } }
      break;
    case 'sample': S.planDraft = samplePlan(); S.view = 'plan'; render(); toast('Ukázkový plán – uprav ho a ulož'); break;
    case 'paddday': S.planDraft.days.push({id: rid(), name: 'Trénink ' + String.fromCharCode(65 + S.planDraft.days.length), exercises: []}); render(); break;
    case 'pdelday': if (await askConfirm('Smazat celý den z plánu? Historie zůstane.', 'Smazat')) { S.planDraft.days.splice(+b.dataset.di, 1); render(); } break;
    case 'paddex': S.planDraft.days[+b.dataset.di].exercises.push({id: rid(), name: '', sets: 3, repMin: 8, repMax: 12, step: 2.5, alternatives: []}); render(); break;
    case 'pdelex': S.planDraft.days[+b.dataset.di].exercises.splice(+b.dataset.ei, 1); render(); break;
    case 'pmove': {
      const ex = S.planDraft.days[+b.dataset.di].exercises, k = +b.dataset.ei, t = k + (+b.dataset.d);
      if (t < 0 || t >= ex.length) return; [ex[k], ex[t]] = [ex[t], ex[k]]; render(); break; }
    case 'prevert': S.planDraft = clone(S.plan); render(); break;
    case 'psave': {
      const p = clone(S.planDraft);
      p.days.forEach(d => { d.name = d.name.trim() || 'Trénink'; d.exercises = d.exercises.filter(e => e.name.trim());
        d.exercises.forEach(e => { e.name = e.name.trim(); e.sets = Math.max(1, e.sets|0 || 3); e.repMin = Math.max(1, e.repMin|0 || 8); e.repMax = Math.max(e.repMin, e.repMax|0 || e.repMin); if (e.step == null) e.step = 2.5; }); });
      try { await store.savePlan(p); S.planDraft = clone(p); render(); toast('Plán uložen'); } catch(e){ toast('Uložení plánu se nepovedlo – zkus to znovu.'); }
      break; }
  }
});
function findSlotIn(p, dayId, sid){ const d = p.days.find(x => x.id === dayId); return d && d.exercises.find(e => e.id === sid); }

document.addEventListener('input', ev => {
  const t = ev.target;
  if (t.dataset.f && S.draft) {
    const s = S.draft.items[+t.dataset.i].sets[+t.dataset.s];
    if (t.dataset.f === 'w') s.w = num(t.value); else { const n = num(t.value); s.r = n == null ? null : Math.round(n); }
    saveDraft(); return;
  }
  if (t.dataset.p && S.planDraft) {
    const d = S.planDraft.days[+t.dataset.di];
    if (t.dataset.p === 'day') d.name = t.value;
    else if (t.dataset.p === 'weekday') d.weekday = t.value === '' ? 0 : +t.value;
    else if (t.dataset.p === 'time') { if (t.value) d.time = t.value; else delete d.time; }
    else if (t.dataset.p === 'dur') { const n = num(t.value); if (n) d.duration = Math.round(n); else delete d.duration; }
    else {
      const e = d.exercises[+t.dataset.ei], f = t.dataset.p;
      if (f === 'name') e.name = t.value;
      else if (f === 'group') e.group = t.value;
      else if (f === 'alts') e.alternatives = t.value.split(',').map(x => x.trim()).filter(Boolean);
      else if (f === 'step') e.step = num(t.value) ?? 0;
      else e[f] = num(t.value) ?? 0;
    }
    const bar = document.querySelector('.savebar');
    if (bar) bar.innerHTML = planDirty() ? '<button class="btn" data-act="prevert">Zrušit změny</button><button class="btn primary" data-act="psave">Uložit plán</button>' : '';
  }
});
document.addEventListener('change', ev => { if (ev.target.dataset.act === 'progsel') { S.progName = ev.target.value; ev.target.blur(); render(); } });
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape' && S.sheet) { S.sheet = null; render(); }
  if (ev.key === 'Enter' && ev.target.id === 'newvar') document.querySelector('[data-act="addvar"]').click();
  if (ev.key === 'Enter' && ev.target.id === 'bw-in') { ev.target.blur(); document.querySelector('[data-act="bwadd"]').click(); }
});

function samplePlan(){
  const ex = (name, sets, lo, hi, step, alts) => ({id: rid(), name, sets, repMin: lo, repMax: hi, step, alternatives: alts});
  return {days: [
    {id: rid(), name: 'Push', exercises: [
      ex('Bench press', 4, 6, 10, 2.5, ['Tlak s jednoručkami na rovné lavici', 'Bench na multipressu']),
      ex('Tlak s jednoručkami nad hlavu', 3, 8, 12, 2, ['Military press', 'Tlak na stroji']),
      ex('Rozpažování na kladkách', 3, 10, 15, 2.5, ['Peck deck']),
      ex('Francouzský tlak', 3, 10, 12, 2.5, ['Stahování kladky na triceps'])]},
    {id: rid(), name: 'Pull', exercises: [
      ex('Shyby', 4, 6, 10, 2.5, ['Stahování horní kladky']),
      ex('Přítahy v předklonu', 3, 8, 12, 2.5, ['Přítah jednoručky', 'Veslování na kladce']),
      ex('Face pull', 3, 12, 15, 2.5, []),
      ex('Bicepsový zdvih s jednoručkami', 3, 8, 12, 1, ['Zdvih s EZ osou'])]},
    {id: rid(), name: 'Nohy', exercises: [
      ex('Dřep', 4, 6, 10, 2.5, ['Hack dřep', 'Leg press']),
      ex('Rumunský mrtvý tah', 3, 8, 12, 2.5, ['Zakopávání na stroji']),
      ex('Výpady s jednoručkami', 3, 10, 12, 2, ['Bulharský dřep']),
      ex('Výpony na lýtka', 4, 12, 15, 5, [])]}
  ]};
}

/* ---------- boot ---------- */
async function boot(){
  S.draft = LS.get('wl-draft', null);
  await localStore.init();
  if (S.draft && !findDay(S.draft.dayId)) { S.draft = null; saveDraft(); }
  S.ready = true; render();
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch(e){}
  if (!S.sessions.length && !S.plan.days.length && !LS.get('wl-welcomed', false)) {
    LS.set('wl-welcomed', true);
    askWelcome();
  }
}
boot();
// zákaz zvětšování dvěma prsty (iOS ignoruje user-scalable)
['gesturestart', 'gesturechange', 'gestureend'].forEach(t => document.addEventListener(t, e => e.preventDefault(), {passive: false}));
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
})();
